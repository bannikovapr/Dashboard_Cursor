# brand.config.yaml
#
# Брендинг и локализация дашборда. Агент подставляет значения в CSS-переменные,
# заголовки, шрифты и локали. Один файл — один "бренд".

version: "1.0"

app:
  title: "Аналитический дашборд"
  # Необязательный подзаголовок/слоган (может быть пустым).
  subtitle: ""
  favicon: "assets/favicon.ico"
  # Логотип: путь, ширина/высота в пикселях, alt.
  logo:
    src: "assets/logo.png"
    width: 96
    height: 96
    alt: "Логотип"

# Язык интерфейса. Влияет на подписи, даты, числа, формат валюты.
i18n:
  locale: "ru-RU"        # BCP-47
  currency: "USD"        # ISO-4217; оставить null если валюты нет
  fallback_locale: "en-US"

# Палитра. Все CSS-переменные ниже агент пробросит в стили фронта.
# Если вы не уверены в цветах — оставьте defaults, агент подберёт совместимые.
palette:
  primary: "#3EA36A"      # акцент (кнопки hover, ключевые элементы)
  accent: "#2F855A"       # вторичный акцент
  bg: "#F7F8FA"           # фон страницы
  surface: "#FFFFFF"      # фон карточек
  text: "#1F2937"         # основной текст
  muted: "#6B7280"        # второстепенный текст
  border: "#E5E7EB"
  # Статусы KPI (зелёный/жёлтый/красный).
  status:
    target: "#16A34A"
    standard: "#D97706"
    below: "#DC2626"
  # Правила цвета графиков:
  # - mono: одна серия / ranking -> одноцветно (используется chart.bar)
  # - categorical: значимая легенда -> палитра categorical
  chart:
    bar: "#3EA36A"
    line: "#2F855A"
    categorical: ["#3EA36A", "#2F855A", "#4F46E5", "#D97706", "#0EA5E9", "#DC2626", "#9333EA"]

# Типографика.
typography:
  font_family: "Montserrat, Inter, system-ui, sans-serif"
  base_size: "14px"
  headings_weight: 600

# Адаптивные брейкпоинты. Используются skill-ом dashboard-builder для DoD.
breakpoints:
  mobile_s: "360px"
  mobile: "390px"
  tablet: "768px"
  laptop: "1024px"
  desktop: "1366px"
  wide: "1920px"

# Макет верхнего уровня.
layout:
  # main_only -> только основная колонка;
  # main_plus_sidebar -> справа AI-панель (нужен AI-ассистент).
  mode: "main_plus_sidebar"
  sidebar_breakpoint: "1440px"    # ниже этой ширины панель складывается в один столбец
  fixed_width: null               # "1440px" если нужна фиксированная рабочая ширина

# Поведение и тональность ассистента (если включён).
assistant:
  enabled: true
  name: "AI-ассистент"
  greeting: "Задайте вопрос по данным дашборда."
  placeholder: "Например: \"Какая выручка за последний месяц?\""
  answer_format: "fact_conclusion_action"   # см. skills/dashboard-assistant
  response_language: "ru"
