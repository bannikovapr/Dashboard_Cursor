version: "1.0"

app:
  title: "Sales Dashboard"
  subtitle: ""
  favicon: ""
  logo:
    src: ""
    width: 80
    height: 80
    alt: "Sales"

i18n:
  locale: "ru-RU"
  currency: "USD"
  fallback_locale: "en-US"

palette:
  primary: "#4F46E5"
  accent:  "#3730A3"
  bg:      "#F7F8FA"
  surface: "#FFFFFF"
  text:    "#1F2937"
  muted:   "#6B7280"
  border:  "#E5E7EB"
  status:
    target:   "#16A34A"
    standard: "#D97706"
    below:    "#DC2626"
  chart:
    bar:  "#4F46E5"
    line: "#3730A3"
    categorical: ["#4F46E5", "#3730A3", "#0EA5E9", "#16A34A", "#D97706", "#DC2626", "#9333EA"]

typography:
  font_family: "Inter, system-ui, sans-serif"
  base_size: "14px"
  headings_weight: 600

breakpoints:
  mobile_s: "360px"
  mobile:   "390px"
  tablet:   "768px"
  laptop:   "1024px"
  desktop:  "1366px"
  wide:     "1920px"

layout:
  mode: "main_plus_sidebar"
  sidebar_breakpoint: "1440px"
  fixed_width: null

assistant:
  enabled: true
  name: "Ассистент"
  greeting: "Задайте вопрос по продажам."
  placeholder: "Например: \"Какая выручка в марте?\""
  answer_format: "fact_conclusion_action"
  response_language: "ru"
